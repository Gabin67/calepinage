<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="apple-touch-icon" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calepinage — Optimiseur de découpe</title>
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#4A5A7A;
    --paper:#F0F3F5;
    --panel:#FFFFFF;
    --grid-line:#D7DEE6;
    --amber:#C97A2B;
    --amber-dark:#9C5D1C;
    --forest:#3F6659;
    --rust:#B5433D;
    --line:#C7CEDA;
    --reuse:#3F8F6E;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--ink);
    font-family:'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .frame{ max-width:1360px; margin:20px auto; padding:0 16px 60px; }

  .titleblock{
    position:relative; border:2px solid var(--ink); background:var(--panel);
    padding:18px 24px; margin-bottom:18px;
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .titleblock::before, .titleblock::after{ content:""; position:absolute; width:14px; height:14px; border:2px solid var(--ink); }
  .titleblock::before{ top:-2px; left:-2px; border-right:none; border-bottom:none; }
  .titleblock::after{ bottom:-2px; right:-2px; border-left:none; border-top:none; }
  .titleblock h1{ font-family:'Space Grotesk','IBM Plex Sans',sans-serif; font-size:26px; letter-spacing:0.5px; margin:0; text-transform:uppercase; }
  .titleblock .tag{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft); letter-spacing:1px; }

  .layout{ display:grid; grid-template-columns:400px 1fr; gap:18px; align-items:start; }
  @media (max-width:940px){ .layout{grid-template-columns:1fr;} }

  .panel{ background:var(--panel); border:1px solid var(--ink); padding:16px; }
  .panel + .panel{margin-top:18px;}
  .panel h2{
    font-family:'Space Grotesk','IBM Plex Sans',sans-serif; font-size:13px; text-transform:uppercase;
    letter-spacing:1.5px; margin:0 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); color:var(--ink-soft);
  }

  label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; font-family:'IBM Plex Mono', monospace; }
  input[type=number], input[type=text], select{
    width:100%; padding:8px 9px; border:1px solid var(--line); border-radius:var(--radius);
    background:#FCFDFE; color:var(--ink); font-family:'IBM Plex Mono', monospace; font-size:13.5px;
  }
  input[type=color]{ width:100%; height:36px; padding:2px; border:1px solid var(--line); border-radius:var(--radius); background:#FCFDFE; cursor:pointer; }
  input:focus, select:focus, button:focus{ outline:2px solid var(--amber); outline-offset:1px; }

  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end;}
  .field{margin-bottom:12px;}

  .checkline{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-soft); }
  .checkline input{width:auto; margin:0; flex-shrink:0;}

  button{
    cursor:pointer; border:1px solid var(--ink); background:var(--ink); color:#fff; padding:10px 14px;
    font-family:'Space Grotesk','IBM Plex Sans',sans-serif; font-size:13px; text-transform:uppercase;
    letter-spacing:0.8px; border-radius:var(--radius);
  }
  button:hover{background:var(--amber-dark); border-color:var(--amber-dark);}
  button.secondary{ background:transparent; color:var(--ink); }
  button.secondary:hover{background:var(--paper); color:var(--ink);}
  button.danger{ background:transparent; color:var(--rust); border-color:var(--rust); padding:5px 8px; font-size:11px; }
  button.danger:hover{background:var(--rust); color:#fff;}

  .addrow-btn{ width:100%; margin-top:10px; background:transparent; color:var(--forest); border:1px dashed var(--forest); }
  .addrow-btn:hover{background:var(--forest); color:#fff;}
  .cta{width:100%; margin-top:16px; padding:13px; font-size:14px;}

  /* ---- Edge type chips ---- */
  .edge-chip-list{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px;}
  .edge-chip{
    --chip-color:#999; display:inline-flex; align-items:center; gap:6px;
    background:#fff; border:1px solid var(--line); padding:5px 9px; border-radius:14px;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink); cursor:pointer;
    text-transform:none; letter-spacing:0;
  }
  .edge-chip:hover{border-color:var(--chip-color); background:var(--paper);}
  .edge-chip .chip-dot{ width:10px; height:10px; border-radius:50%; background:var(--chip-color); flex:none; }
  .edge-chip .chip-del{ color:var(--ink-soft); font-weight:600; padding:0 2px; }
  .edge-chip .chip-del:hover{color:var(--rust);}
  .edge-chip-none{color:var(--ink-soft); font-style:italic;}
  .hint{font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.4;}

  /* ---- Part cards ---- */
  .part-card{ border:1px solid var(--line); padding:10px 11px; margin-bottom:10px; background:#FCFDFE; }
  .part-card-top{ display:flex; gap:7px; align-items:center; margin-bottom:8px; }
  .part-card-top .p-sel{width:auto; flex:none;}
  .part-card-top .p-name{flex:1; font-size:13px;}
  .part-dims{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:8px; }
  .part-dims .field{margin-bottom:0;}
  .part-dims label{font-size:10px;}
  .part-dims input{padding:6px 7px; font-size:12.5px;}

  .part-flags{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed var(--line); }
  .part-flags select{width:auto; padding:5px 6px; font-size:11.5px;}

  .chant-grid-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--ink-soft); margin-bottom:5px; }
  .chant-grid{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .chant-slot label{font-size:9.5px; margin-bottom:2px;}
  .chant-cell{display:flex; align-items:center; gap:5px;}
  .chant-swatch{ width:10px; height:10px; border-radius:50%; flex:none; border:1px solid rgba(27,42,74,0.25); background:transparent; }
  .chant-slot select{font-size:11px; padding:5px 5px;}

  /* ---- Results ---- */
  .summary-strip{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .stat{ flex:1; min-width:120px; background:var(--panel); border:1px solid var(--ink); padding:10px 14px; }
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; }
  .stat .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); }
  .stat.waste .num{color:var(--rust);}
  .stat.used .num{color:var(--forest);}

  .legend-strip{
    display:flex; flex-wrap:wrap; gap:16px; background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; margin-bottom:18px; font-size:11.5px;
  }
  .legend-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .legend-title{font-family:'IBM Plex Mono', monospace; color:var(--ink-soft); text-transform:uppercase; font-size:10px; letter-spacing:0.5px;}
  .legend-item{display:inline-flex; align-items:center; gap:5px; color:var(--ink-soft);}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex:none;}

  .sheet-card{ background:var(--panel); border:1px solid var(--ink); margin-bottom:22px; }
  .sheet-svg-wrap{
    padding:14px;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 23px, rgba(27,42,74,0.035) 24px),
      repeating-linear-gradient(90deg, transparent, transparent 23px, rgba(27,42,74,0.035) 24px);
  }
  .sheet-svg-wrap svg{width:100%; height:auto; display:block;}
  .sheet-infobar{
    display:flex; justify-content:space-between; align-items:center; padding:8px 14px;
    border-top:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:var(--ink-soft); flex-wrap:wrap; gap:6px;
  }
  .sheet-infobar b{color:var(--ink); font-weight:600;}

  .final-report{ background:var(--panel); border:1px solid var(--ink); padding:16px; margin-top:6px; }
  .final-report h3{
    font-family:'Space Grotesk','IBM Plex Sans',sans-serif; font-size:13px; text-transform:uppercase;
    letter-spacing:1.5px; margin:0 0 12px; color:var(--ink-soft); border-bottom:1px solid var(--line); padding-bottom:8px;
  }
  .final-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px; }
  .final-grid .num{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-weight:600; }
  .final-grid .lbl{ font-size:10px; text-transform:uppercase; letter-spacing:0.8px; color:var(--ink-soft); }
  .reuse-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px; }
  .reuse-list li{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--ink-soft);
    border-bottom:1px solid #EEF1F4; padding:4px 0; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  .reuse-list b{color:var(--forest);}
  .reuse-none{font-size:12px; color:var(--ink-soft); font-style:italic;}

  .empty-state{ padding:50px 20px; text-align:center; color:var(--ink-soft); border:1px dashed var(--line); background:var(--panel); }
  .part-rect text{font-family:'IBM Plex Mono', monospace;}
  .toolbar{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}

  @media print{
    body{background:#fff; background-image:none;}
    .layout{display:block;}
    .panel:first-child, .toolbar{display:none;}
    .sheet-card{break-inside:avoid; page-break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="titleblock">
    <h1>Calepinage</h1>
    <span class="tag">OPTIMISEUR DE DÉCOUPE — PANNEAUX / TÔLE / VERRE</span>
  </div>

  <div class="layout
